document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

dit vir jou s\\u00ea.\", \"No pressure. If the boot camp is not the right thing for your child, we will tell you.\"),\n      formLabel: T(\"Bespreek jou oproep\", \"Book your call\"),\n      fName: T(\"Ouer se naam\", \"Parent's name\"),\n      phName: T(\"Bv. Anel\", \"E.g. Anel\"),\n      fWa: T(\"WhatsApp nommer\", \"WhatsApp number\"),\n      fChild: T(\"Kind se naam\", \"Child's name\"),\n      fSchool: T(\"Skool\", \"School\"),\n      fMark: T(\"Kind se laaste punt (%)\", \"Child's last mark (%)\"),\n      phMark: T(\"Bv. 43\", \"E.g. 43\"),\n      fWorry: T(\"Grootste bekommernis\", \"Biggest worry\"),\n      phWorry: T(\"Waaroor l\\u00ea jy snags wakker?\", \"What keeps you up at night?\"),\n      fDate: T(\"Kies 'n dag\", \"Pick a day\"),\n      fTime: T(\"Kies 'n tyd\", \"Pick a time\"),\n      consent: T(\"Ek gee toestemming dat LocalTutors my besonderhede gebruik om my te kontak oor hierdie bootcamp, soos in POPIA bepaal.\", \"I give permission for LocalTutors to use my details to contact me about this boot camp, as set out in POPIA.\"),\n      submit: T(\"Bevestig my oproep\", \"Confirm my call\"),\n      errName: T(\"Ons het net 'n naam nodig om jou aan te spreek.\", \"We just need a name to call you by.\"),\n      errWa: T(\"Kyk gou die nommer, ons kry dit nie reg nie.\", \"Check the number quickly, it does not look right.\"),\n      errChild: T(\"Wie se werk gaan ons help regmaak?\", \"Whose work are we going to help fix?\"),\n      errDate: T(\"Kies asseblief 'n dag hierbo.\", \"Please pick a day above.\"),\n      errTime: T(\"Kies asseblief 'n tyd hierbo.\", \"Please pick a time above.\"),\n      errConsent: T(\"Ons mag jou eers bel as jy hier merk.\", \"We may only call you once you tick here.\"),\n      successLabel: T(\"Gereed\", \"Ready\"),\n      mailSending: T(\"Ons stuur jou besonderhede aan LocalTutors\\u2026\", \"Sending your details to LocalTutors\\u2026\"),\n      mailSent: T(\"Jou besonderhede is per e-pos aan LocalTutors gestuur.\", \"Your details have been emailed to LocalTutors.\"),\n      mailFailed: T(\"Die e-pos wou nie deurgaan nie. Stuur dit gou op WhatsApp, of e-pos ons direk:\", \"The email did not go through. Send it on WhatsApp quickly, or email us directly:\"),\n      successTitlePre: T(\"Dankie, \", \"Thank you, \"),\n      successBody: T(\"Stuur dit net vir ons op WhatsApp, dan hou ons die tyd oop en bel julle daardie dag.\", \"Just send it to us on WhatsApp, then we hold the time open and call you that day.\"),\n      slotLabel: T(\"Jou gekose tyd\", \"Your chosen slot\"),\n      waConfirm: T(\"Bevestig op WhatsApp\", \"Confirm on WhatsApp\"),\n      editAgain: T(\"Verander my besonderhede\", \"Change my details\"),\n      faqHeading: T(\"Vrae wat ouers vra\", \"Questions parents ask\"),\n      faqMore: T(\"Nog 'n vraag?\", \"Any other question?\"),\n      faqWa: T(\"WhatsApp ons\", \"WhatsApp us\"),\n      spotsOpen: T(\"plekke oop\", \"spots open\"),\n      filledOf: T(\"van\", \"of\"),\n      filledWord: T(\"plekke gevul\", \"spots filled\"),\n      days: [T(\"So\", \"Sun\"), T(\"Ma\", \"Mon\"), T(\"Di\", \"Tue\"), T(\"Wo\", \"Wed\"), T(\"Do\", \"Thu\"), T(\"Vr\", \"Fri\"), T(\"Sa\", \"Sat\")],\n      months: [T(\"Jan\", \"Jan\"), T(\"Feb\", \"Feb\"), T(\"Mrt\", \"Mar\"), T(\"Apr\", \"Apr\"), T(\"Mei\", \"May\"), T(\"Jun\", \"Jun\"), T(\"Jul\", \"Jul\"), T(\"Aug\", \"Aug\"), T(\"Sep\", \"Sep\"), T(\"Okt\", \"Oct\"), T(\"Nov\", \"Nov\"), T(\"Des\", \"Dec\")],\n      waIntro: T(\"Hallo LocalTutors! Ek wil graag 'n gratis 15-min oproep bespreek.\", \"Hello LocalTutors! I would like to book a free 15-min call.\"),\n      waBootcamp: T(\"Bootcamp\", \"Boot camp\"),\n      waParent: T(\"Ouer\", \"Parent\"),\n      waChild: T(\"Kind\", \"Child\"),\n      waSchool: T(\"Skool\", \"School\"),\n      waMark: T(\"Laaste punt\", \"Last mark\"),\n      waWorry: T(\"Grootste bekommernis\", \"Biggest worry\"),\n      waSlot: T(\"Gekose tyd\", \"Chosen slot\"),\n      testimonialHint: T(\"Naam van ouer, kind se graad, en wat verander het.\", \"Parent's name, child's grade, and what changed.\"),\n      statsHeading: T(\"Laaste 12 maande\", \"Last 12 months\")\n    };\n\n    const stats = [\n      { big: T(\"100%\", \"100%\"), label: T(\"Graad 8 leerder se Wiskunde punt, laaste 12 maande\", \"Grade 8 learner's Maths mark, last 12 months\") },\n      { big: T(\"Vlak 5\", \"Level 5\"), label: T(\"Graad 3 leerder, van druip tot vlak 5 in minder as 2 maande\", \"Grade 3 learner, from failing to a level 5 in under 2 months\") },\n      { big: T(\"1 maand\", \"1 month\"), label: T(\"Graad 4 leerder wat nie kon lees nie, lees self binne die eerste maand\", \"Grade 4 learner who couldn't read, reading independently within the first month\") },\n      { big: T(\"20+\", \"20+\"), label: T(\"gesinne in Upington vertrou ons met hul kinders\", \"families in Upington trust us with their children\") }\n    ];\n\n    const bootcamps = [\n      /* ------------------------- BOOTCAMP 1 ------------------------- */\n      {\n        id: \"gr10-rekeningkunde-wiskunde\",\n        grade: \"10\",\n        subject: T(\"Rekeningkunde & Wiskunde\", \"Accounting & Maths\"),\n        name: T(\"Graad 10 Rekeningkunde & Wiskunde Bootcamp\", \"Grade 10 Accounting & Maths Boot Camp\"),\n        hook: T(\"Agt maande se werk, ingehaal in vier dae.\", \"Eight months of work, caught up in four days.\"),\n        eyebrow: T(\"Graad 10 \\u00b7 Rekeningkunde & Wiskunde \\u00b7 Upington\", \"Grade 10 \\u00b7 Accounting & Maths \\u00b7 Upington\"),\n        headline: T(\"Vier dae om agt maande se agterstand toe te maak.\", \"Four days to close eight months of falling behind.\"),\n        lead: T(\"Jou kind het stil-stil agter geraak in Terme 1 tot 3. Ons vat daardie agt maande se werk, druk dit saam in vier gefokusde dae, en begin dan met Kwartaal 4 se werk voor die kwartaal eers begin.\", \"Your child quietly fell behind in Terms 1 to 3. We take those eight months of work, compress it into four focused days, then start on Term 4 work before the term even begins.\"),\n        factRows: [\n          { label: T(\"Lengte\", \"Length\"), value: T(\"4 dae\", \"4 days\") },\n          { label: T(\"Dae\", \"Days\"), value: T(\"Ma tot Do\", \"Mon to Thu\") },\n          { label: T(\"Ure\", \"Hours\"), value: T(\"5 uur per dag\", \"5 hours a day\") },\n          { label: T(\"Groep\", \"Group\"), value: T(\"Maks 5 leerders\", \"Max 5 learners\") },\n          { label: T(\"Datums\", \"Dates\"), value: \"dates\" },\n          { label: T(\"Plek\", \"Venue\"), value: \"venue\" },\n          { label: T(\"Sluit\", \"Closes\"), value: \"closes\" }\n        ],\n        people: {\n          p1: T(\"Die punte sak stadig. By die etenstafel is dit net 'dit gaan reg, Ma'. Huiswerk raak 'n bakleiery wat niemand wen nie.\", \"The marks slide slowly. At the dinner table it is just 'it's fine, Mom'. Homework becomes a fight nobody wins.\"),\n          p2: T(\"Om maande lank te betaal vir een uur per week wat kruip, met 'n rekening wat elke maand weer kom.\", \"Paying for months of weekly lessons that crawl, with an invoice that comes back every month.\"),\n          p3: T(\"Kwartaal 4 en die finale eksamen begin met dieselfde gate. In Graad 11 word sy na Wiskundige Geletterdheid gestoot, en die deur na BCom, rekeningkunde en ingenieurswese gaan toe.\", \"Term 4 and the final exams start with the same gaps. In Grade 11 she is pushed to Maths Literacy, and the door to BCom, accounting and engineering closes.\"),\n          p4: T(\"'n Kind wat Kwartaal 4 ingaan, ingehaal, kalm, en een tree voor.\", \"A child who starts Term 4 caught up, calm, and one step ahead.\"),\n          quote: T(\"Ek weet nie eers meer waar die gate is nie. Ek weet net sy is nie meer die kind wat van Wiskunde gehou het nie.\", \"I don't even know where the gaps are any more. I just know she is not the child who liked Maths any more.\")\n        },\n        process: {\n          believe: T(\"Om in te haal beteken een uur per week, vir maande aaneen.\", \"Catching up means an hour a week, for months on end.\"),\n          wrong: T(\"Gate bou op mekaar. 'n Stadige drup maak nooit die gat toe voor die volgende kwartaal se werk opstapel nie, en op die ou end kos dit meer.\", \"Gaps build on each other. A slow drip never closes them before the next term's work piles on, and it costs more in the end.\"),\n          we: T(\"Maak dit reg in een gefokusde stoot, en beskerm dit dan met opvolg.\", \"Fix it properly in one focused burst, then protect it with follow-up.\"),\n          methodName: T(\"Die 4-Dag Inhaal-metode\", \"The 4-Day Catch-Up Method\"),\n          methodLine: T(\"Vind die gate, maak hulle toe, kom voor met die volgende kwartaal, bewys die verskil met twee toetse, en hou dit so met drie weke se opvolg.\", \"Find the gaps, close them, get ahead on the next term, prove the difference with two tests, and hold it there with three weeks of follow-up.\"),\n          steps: [\n            { n: \"DAG 01\", title: T(\"Vind die gate\", \"Find the gaps\"), body: T(\"Ons toets presies waar dit begin skeef loop het.\", \"We test exactly where it started going wrong.\") },\n            { n: \"DAG 02 / 03\", title: T(\"Maak Kwartaal 1 tot 3 toe\", \"Close Terms 1 to 3\"), body: T(\"Elke gat word een vir een gevat, met oefening tot dit sit.\", \"Every gap is taken one by one, with practice until it holds.\") },\n            { n: \"DAG 04\", title: T(\"Kom voor\", \"Get ahead\"), body: T(\"Ons begin met Kwartaal 4 se werk voor die kwartaal begin.\", \"We start on Term 4 work before the term begins.\") },\n            { n: \"DAG 04\", title: T(\"Twee toetse\", \"Two tests\"), body: T(\"Sy skryf twee toetse vir ons, sodat julle swart op wit sien hoeveel sy verbeter het teenoor haar vorige punte.\", \"She writes two tests for us, so you see in black and white how much she improved against her previous marks.\") },\n            { n: T(\"GRATIS\", \"FREE\"), title: T(\"Die 3-Uur Studiedag werkswinkel\", \"The 3-Hour Study Day workshop\"), body: T(\"Kyle wys haar hoe om 'n vak wat 'n hele dag se swot gevat het, in 2 tot 3 uur te doen, en te onthou wat sy geleer het.\", \"Kyle shows her how to do a subject that used to take a full day of studying in 2 to 3 hours, and remember what she studied.\") },\n            { n: T(\"DAARNA\", \"AFTER\"), title: T(\"3 weke opvolg\", \"3 weeks follow-up\"), body: T(\"Ses klein groep lesse om dit vas te maak.\", \"Six small group lessons to lock it in.\") }\n          ]\n        },\n        advantages: {\n          a1: { title: T(\"Maks 5 leerders\", \"Max 5 learners\"), body: T(\"Klein genoeg dat jou kind kan erken wat sy nie verstaan nie.\", \"Small enough that your child can admit what she does not understand.\") },\n          a2: { title: T(\"Vier dae, nie agt maande nie\", \"Four days, not eight months\"), body: T(\"Dieselfde werk, in een week klaargemaak.\", \"The same work, finished in one week.\") },\n          a3: { title: T(\"Daaglikse terugvoer\", \"Daily updates\"), body: T(\"Jy weet elke dag wat gedoen is en wat ons opgelet het.\", \"Every day you know what was covered and what we noticed.\") },\n          a4: { title: T(\"Drie weke gratis opvolg\", \"Three weeks free follow-up\"), body: T(\"Dit hou nie op wanneer die bootcamp klaar is nie.\", \"It does not stop when the boot camp ends.\") }\n        },\n        compare: {\n          colA: T(\"Een uur per week vir 8 maande\", \"An hour a week for 8 months\"),\n          colB: T(\"4-dag Bootcamp\", \"4-day Boot Camp\"),\n          rows: [\n            { label: T(\"Tyd om in te haal\", \"Time to catch up\"), a: T(\"8 maande\", \"8 months\"), b: T(\"4 dae\", \"4 days\") },\n            { label: T(\"Nog agter wanneer Kwartaal 4 begin\", \"Still behind when Term 4 starts\"), a: T(\"Waarskynlik\", \"Likely\"), b: T(\"Nee, reeds met Kwartaal 4 begin\", \"No, already started on Term 4\") },\n            { label: T(\"Ouer weet wat aangaan\", \"Parent knows what's happening\"), a: T(\"Af en toe\", \"Occasionally\"), b: T(\"Daaglikse terugvoer\", \"Daily updates\") },\n            { label: T(\"Ondersteuning daarna\", \"Support afterwards\"), a: T(\"Geen\", \"None\"), b: T(\"3 weke gratis opvolg plus Die Studiemaat\", \"3 weeks free follow-up plus The Study Companion\") }\n          ]\n        },\n        promise: [\n          { before: T(\"Vermy Rekeningkunde huiswerk\", \"Avoids Accounting homework\"), after: T(\"Sit self en werk deur 'n vraag\", \"Sits down and works through a question alone\") },\n          { before: T(\"'Ek is net nie 'n Wiskunde mens nie'\", \"'I'm just not a Maths person'\"), after: T(\"'Ek weet hoe om dit aan te pak'\", \"'I know how to tackle this'\") },\n          { before: T(\"Begin Kwartaal 4 agter\", \"Starts Term 4 behind\"), after: T(\"Begin Kwartaal 4 met die werk reeds gesien\", \"Starts Term 4 having already seen the work\") }\n        ],\n        soWhat: T(\"Graad 10 punte besluit watter vakke jou kind in Graad 11 mag hou. Wiskunde, nie Wiskundige Geletterdheid nie, hou die deur oop na BCom, rekeningkunde, ingenieurswese en medies. Vier dae nou beskerm daardie deure.\", \"Grade 10 marks decide which subjects your child may keep in Grade 11. Maths, not Maths Literacy, keeps the door open to BCom, accounting, engineering and medicine. Four days now protects those doors.\"),\n        tutor: {\n          initials: \"A\",\n          photo: \"assets/tutor-alistair-v2.png\",\n          name: T(\"Alistair\", \"Alistair\"),\n          role: T(\"Rekeningkunde & Wiskunde tutor\", \"Accounting & Maths tutor\"),\n          creds: [\n            { text: T(\"N8 in Finansies\", \"N8 in Finance\") },\n            { text: T(\"Besig met 'n graad in Rekeningkunde\", \"Currently pursuing a degree in Accounting\") },\n            { text: T(\"Het een van ons leerders van Wiskunde druip tot 'n vlak 5 gevat, in minder as 2 maande\", \"Took one of our learners from failing Maths to a level 5, in under 2 months\") }\n          ],\n          note: T(\"Die Studievaardigheidswerkswinkel word aangebied deur Kyle, stigter van LocalTutors, met 'n agtergrond in Bedryfsielkunde.\", \"The Study Skills Workshop is run by Kyle, founder of LocalTutors, with a background in Industrial Psychology.\")\n        },\n        testimonials: [\n          { text: T(\"Candace het van niks van algebra verstaan nie, tot 'n kind wat Wiskunde geniet. Sy het nog nie een les gemis nie.\", \"Candace went from understanding nothing of algebra to a child who enjoys Maths. She hasn't missed a single lesson.\"), who: T(\"Milla, ouer van Candace, Graad 9\", \"Milla, parent of Candace, Grade 9\") },\n          { text: T(\"Jayden het gesukkel met Wiskunde. Nou doen hy Graad 8 werk, voor sy eie groep.\", \"Jayden was struggling with Maths. Now he does Grade 8 level work, ahead of his own group.\"), who: T(\"Zoe, ouer van Jayden, Graad 7\", \"Zoe, parent of Jayden, Grade 7\") }\n        ],\n        included: [\n          { name: T(\"4-dag intensiewe bootcamp\", \"4-day intensive boot camp\"), means: T(\"16 tot 20 uur lewendige onderrig wat Kwartaal 1 tot 3 se gate toemaak en voorkom met Kwartaal 4.\", \"16 to 20 hours of live teaching, catching up Term 1 to 3 gaps and getting ahead on Term 4.\") },\n          { name: T(\"3 weke opvolg tutoring na die bootcamp\", \"3 weeks of follow-up tutoring after the boot camp\"), means: T(\"Ses klein groep lesse van een uur elk, gratis.\", \"Six one-hour small-group lessons, free.\") },\n          { name: T(\"Die Studiemaat (The Study Companion)\", \"The Study Companion (Die Studiemaat)\"), means: T(\"Die huis toe bundel studiegidse, aktiwiteite en die ouergids. Gebou sodat die leerder self deur dieselfde materiaal kan werk, amper of daar 'n tutor langs haar sit. Selfs as 'n ouer nie daarna by ons aangaan nie, is daar genoeg in om die leerder tot by die finale eksamen te dra.\", \"The take-home bundle of study guides, activities and the parent guide. Built so the learner can keep working through the same material at home, almost like having a tutor there with them. Even if a parent doesn't continue with us afterwards, it has enough in it to carry the learner through to final exams.\") },\n          { name: T(\"Die Studievaardigheidswerkswinkel met Kyle\", \"The Study Skills Workshop with Kyle\"), means: T(\"Die 3-Uur Studiedag: hoe om 'n vak wat 'n hele dag se swot gevat het in 2 tot 3 uur klaar te maak, en te onthou wat sy geleer het.\", \"The 3-Hour Study Day: how to finish a subject that used to take a full day of studying in 2 to 3 hours, and remember what she studied.\") },\n          { name: T(\"Daaglikse ouer terugvoer\", \"Daily parent updates\"), means: T(\"Wat ons daardie dag gedek het, wat more beplan word, en wat ons spesifiek van jou kind opgelet het: sterkpunte en waar ons meer aandag gee.\", \"What we covered that day, what's planned for tomorrow, and what we noticed about your child specifically, strengths and where we're focusing more attention.\") },\n          { name: T(\"Etes vir al vier dae\", \"Meals for all four days\"), means: T(\"Jy hoef nie kos te pak nie, ons sorg vir al vier dae.\", \"You don't need to pack food, we handle all four days.\") },\n          { name: T(\"Alle skryfbehoeftes en materiaal\", \"All stationery and materials\"), means: T(\"Alles wat sy nodig het is reeds daar.\", \"Everything she needs is already there.\") }\n        ],\n        guarantee: null,\n        ifNothing: [\n          { text: T(\"Nog 'n kwartaal van een uur per week wat kruip.\", \"Another term of an hour a week that crawls.\") },\n          { text: T(\"Die finale eksamen begin met dieselfde gate.\", \"The final exams start with the same gaps.\") },\n          { text: T(\"Minder vakkeuses in Graad 11, en 'n duur inhaal later.\", \"Fewer subject choices in Grade 11, and an expensive catch-up later.\") }\n        ],\n        ifNow: [\n          { text: T(\"Vier dae, dan is die gate toe.\", \"Four days, then the gaps are closed.\") },\n          { text: T(\"Kwartaal 4 begin met die werk reeds gesien.\", \"Term 4 starts with the work already seen.\") },\n          { text: T(\"Drie weke gratis opvolg hou dit so.\", \"Three weeks of free follow-up keeps it that way.\") }\n        ],\n        scarcityNote: T(\"Ons hou die groep op maks 5 leerders, doelbewus. So kry elke leerder regte aandag, en voel sy gemaklik genoeg om te s\\u00ea wat sy nie verstaan nie.\", \"We keep the group at max 5 learners on purpose. That way every learner gets real attention and feels comfortable admitting what they don't understand.\"),\n        faq: [\n          { q: T(\"Wat as my kind net in een van die twee vakke agter is?\", \"What if my child is only behind in one of the two subjects?\"), a: T(\"Dis reg so. Ons toets op Dag 1 en gee dan meer tyd aan die vak waar die gate is. Die ander vak word gebruik om voor te kom vir Kwartaal 4.\", \"That's fine. We test on Day 1 and then give more time to the subject where the gaps are. The other subject is used to get ahead for Term 4.\") },\n          { q: T(\"Wat gebeur na die 4 dae?\", \"What happens after the 4 days?\"), a: T(\"Drie weke opvolg tutoring, ses klein groep lesse van een uur elk, gratis. Die Studiemaat gaan saam huis toe sodat sy self kan aanhou werk.\", \"Three weeks of follow-up tutoring, six one-hour small-group lessons, free. The Study Companion goes home so she can keep working on her own.\") },\n          { q: T(\"Wat kos dit?\", \"What does it cost?\"), a: T(\"Ons bespreek die prys op die gratis 15-min oproep, saam met of die bootcamp regtig die regte ding vir jou kind is.\", \"We discuss the price on the free 15-min call, together with whether the boot camp is really the right thing for your child.\") },\n          { q: T(\"Is etes en skryfbehoeftes regtig ingesluit?\", \"Are meals and stationery really included?\"), a: T(\"Ja. Etes vir al vier dae, en alle skryfbehoeftes en materiaal. Bring net die kind.\", \"Yes. Meals for all four days, and all stationery and materials. Just bring the child.\") },\n          { q: T(\"Waar en wanneer presies?\", \"Where and when exactly?\"), a: T(\"Dit begin 28 September, Maandag tot Donderdag, 5 uur per dag. Registrasie sluit 26 September. Die plek deel ons op die oproep met ouers wat inskryf.\", \"It starts 28 September, Monday to Thursday, 5 hours a day. Registration closes 26 September. We share the venue on the call with parents who sign up.\") },\n          { q: T(\"Skryf hulle enige toetse?\", \"Do they write any tests?\"), a: T(\"Ja. Op Dag 4 skryf sy twee toetse vir ons, sodat julle kan sien hoeveel sy verbeter het teenoor haar vorige punte.\", \"Yes. On Day 4 she writes two tests for us, so you can see how much she improved against her previous marks.\") }\n        ]\n      },\n\n      /* ------------------------- BOOTCAMP 2 ------------------------- */\n      {\n        id: \"gr12-rekeningkunde\",\n        grade: \"12\",\n        subject: T(\"Rekeningkunde\", \"Accounting\"),\n        name: T(\"Graad 12 Rekeningkunde Eindeksamen Bootcamp\", \"Grade 12 Accounting Finals Boot Camp\"),\n        hook: T(\"Verstaan die hoekom, nie net die formaat nie.\", \"Understand the why, not just the format.\"),\n        eyebrow: T(\"Graad 12 \\u00b7 Rekeningkunde \\u00b7 Upington\", \"Grade 12 \\u00b7 Accounting \\u00b7 Upington\"),\n        headline: T(\"'n Paar persent staan tussen jou kind en 'n BCom plek.\", \"A few percent stand between your child and a BCom place.\"),\n        lead: T(\"Jou matriek wil volgende jaar BCom, Rekeningkunde of Finansies studeer. Die punt is amper daar, maar nie heeltemal nie. Ons werk aan die logika agter elke transaksie, sodat 'n vraag wat anders bewoord is haar nie laat vries nie.\", \"Your matric wants to study BCom, Accounting or Finance next year. The mark is almost there, but not quite. We work on the logic behind every transaction, so a question phrased differently does not make her freeze.\"),\n        factRows: [\n          { label: T(\"Formaat\", \"Format\"), value: \"format\" },\n          { label: T(\"Groep\", \"Group\"), value: T(\"Maks 10 leerders\", \"Max 10 learners\") },\n          { label: T(\"Datums\", \"Dates\"), value: \"dates\" },\n          { label: T(\"Plek\", \"Venue\"), value: \"venue\" },\n          { label: T(\"Prys\", \"Price\"), value: T(\"Op die oproep\", \"On the call\") },\n          { label: T(\"Sluit\", \"Closes\"), value: \"closes\" }\n        ],\n        people: {\n          p1: T(\"Sy skryf past paper na past paper. Die punt skuif twee persent en bly dan staan.\", \"She writes past paper after past paper. The mark moves two percent and then stalls.\"),\n          p2: T(\"Om 'n jaar te verloor, of 'n graad te kies wat sy nooit wou h\\u00ea nie.\", \"Losing a year, or choosing a degree she never wanted.\"),\n          p3: T(\"Sy mis BCom toelating met 'n paar persent, en die aansoek gaan na die waglys.\", \"She misses BCom admission by a few percent, and the application goes to the waiting list.\"),\n          p4: T(\"Sy loop die eindeksamen in met die logika in haar kop, nie net die formaat nie.\", \"She walks into the final exam with the logic in her head, not just the format.\"),\n          quote: T(\"Sy ken die formaat uit haar kop. Sodra die vraag anders gevra word, vries sy.\", \"She knows the format by heart. The moment the question is asked differently, she freezes.\")\n        },\n        process: {\n          believe: T(\"Meer past papers beteken meer punte.\", \"More past papers means more marks.\"),\n          wrong: T(\"Dis verkeerd, want as jy formate memoriseer sonder die logika, vries jy sodra 'n vraag anders bewoord word.\", \"That's wrong, because memorising formats without the logic makes learners freeze when a question is phrased differently.\"),\n          we: T(\"Ons leer eers die logika agter elke transaksie, dan die formaat.\", \"We teach the logic behind each transaction first, then the format.\"),\n          methodName: T(\"Die Hoekom-Eerste-metode\", \"The Why-First method\"),\n          methodLine: T(\"Elke transaksie het 'n rede. Sodra sy die rede sien, werk sy die formaat self uit, ook as die vraag anders lyk.\", \"Every transaction has a reason. Once she sees the reason, she works out the format herself, even when the question looks different.\"),\n          steps: [\n            { n: \"01\", title: T(\"Toets die logika\", \"Test the logic\"), body: T(\"Ons kyk waar die begrip ophou en die geheue begin.\", \"We look at where understanding stops and memory starts.\") },\n            { n: \"02\", title: T(\"Bou die hoekom\", \"Build the why\"), body: T(\"Elke transaksie word terug gevat na die rede daaragter.\", \"Every transaction is taken back to the reason behind it.\") },\n            { n: \"03\", title: T(\"Pas dit toe op die formaat\", \"Apply it to the format\"), body: T(\"Nou eers kom die uitleg van die antwoord.\", \"Only now does the layout of the answer come in.\") },\n            { n: \"04\", title: T(\"Skryf vreemde vrae\", \"Write unfamiliar questions\"), body: T(\"Vrae wat anders bewoord is, tot dit nie meer skrik nie.\", \"Questions phrased differently, until they stop being scary.\") }\n          ]\n        },\n        advantages: {\n          a1: { title: T(\"Maks 10 leerders\", \"Max 10 learners\"), body: T(\"Klein genoeg dat elke leerder gevra en gehelp word.\", \"Small enough that every learner gets asked and gets helped.\") },\n          a2: { title: T(\"Gefokus op die eindeksamen\", \"Focused on the finals\"), body: T(\"Alles wys na die vraestel wat sy gaan skryf.\", \"Everything points at the paper she is going to write.\") },\n          a3: { title: T(\"Hoekom-Eerste-metode\", \"Why-First method\"), body: T(\"Die logika eerste, sodat vreemde bewoording nie meer keer nie.\", \"The logic first, so unfamiliar wording stops blocking her.\") },\n          a4: { title: T(\"Mario as tutor\", \"Mario as tutor\"), body: T(\"Gekwalifiseerde CA met CGMA benoeming, en universiteitsdosent.\", \"A qualified CA with a CGMA designation, and a university lecturer.\") }\n        },\n        compare: {\n          colA: T(\"Nog past papers\", \"More past papers\"),\n          colB: T(\"Hoekom-Eerste Bootcamp\", \"Why-First Boot Camp\"),\n          rows: [\n            { label: T(\"Wat geoefen word\", \"What gets practised\"), a: T(\"Formate memoriseer\", \"Memorising formats\"), b: T(\"Die logika agter elke transaksie\", \"The logic behind each transaction\") },\n            { label: T(\"As die vraag anders gevra word\", \"When the question is phrased differently\"), a: T(\"Sy vries\", \"She freezes\"), b: T(\"Sy werk dit uit\", \"She works it out\") },\n            { label: T(\"Groepgrootte\", \"Group size\"), a: T(\"'n Vol klas\", \"A full class\"), b: T(\"Maks 10 leerders\", \"Max 10 learners\") },\n            { label: T(\"Wie leer haar\", \"Who teaches her\"), a: T(\"Wissel\", \"Varies\"), b: T(\"Mario, CA met CGMA, universiteitsdosent\", \"Mario, CA with CGMA, university lecturer\") }\n          ]\n        },\n        promise: [\n          { before: T(\"Memoriseer formate\", \"Memorises formats\"), after: T(\"Verstaan die logika agter die syfers\", \"Understands the logic behind the numbers\") },\n          { before: T(\"Vries by 'n vreemde vraag\", \"Freezes at an unfamiliar question\"), after: T(\"Werk rustig deur 'n vreemde vraag\", \"Works calmly through an unfamiliar question\") },\n          { before: T(\"Hoop vir toelating\", \"Hopes for admission\"), after: T(\"Skryf vir die punt wat toelating gee\", \"Writes for the mark that gives admission\") }\n        ],\n        soWhat: T(\"'n Paar persent is die verskil tussen 'n BCom plek en 'n waglys.\", \"A few percent is the difference between a BCom place and a waiting list.\"),\n        tutor: {\n          initials: \"M\",\n          photo: \"assets/tutor-mario-v2.png\",\n          name: T(\"Mario\", \"Mario\"),\n          role: T(\"Rekeningkunde tutor\", \"Accounting tutor\"),\n          creds: [\n            { text: T(\"Graad in Geoktrooieerde Rekeningkunde\", \"Degree in Chartered Accounting\") },\n            { text: T(\"CGMA benoeming\", \"CGMA designation\") },\n            { text: T(\"Universiteitsdosent in Rekeningkunde\", \"University Accounting lecturer\") }\n          ],\n          note: T(\"Hy merk en doseer die werk wat jou kind gaan skryf, en weet presies waar punte verloor word.\", \"He marks and lectures the work your child is going to write, and knows exactly where marks get lost.\")\n        },\n        testimonials: [],\n        included: [\n          { name: T(\"Formaat\", \"Format\"), means: T(\"[FORMAAT WORD BEVESTIG]\", \"[FORMAT TO BE CONFIRMED]\"), ph: true },\n          { name: T(\"Insluitings\", \"Inclusions\"), means: T(\"[INSLUITINGS WORD BEVESTIG]\", \"[INCLUSIONS TO BE CONFIRMED]\"), ph: true },\n          { name: T(\"Prys\", \"Price\"), means: T(\"Ons bespreek dit op die gratis oproep.\", \"We discuss it on the free call.\") }\n        ],\n        guarantee: null,\n        ifNothing: [\n          { text: T(\"Nog past papers, en die punt bly staan.\", \"More past papers, and the mark stays where it is.\") },\n          { text: T(\"Die eindeksamen kom nader met dieselfde vrees vir vreemde vrae.\", \"The finals get closer with the same fear of unfamiliar questions.\") },\n          { text: T(\"Toelating h\\u00e1ng aan 'n paar persent.\", \"Admission hangs on a few percent.\") }\n        ],\n        ifNow: [\n          { text: T(\"Sy leer die logika terwyl daar nog tyd is om dit te oefen.\", \"She learns the logic while there is still time to practise it.\") },\n          { text: T(\"Vreemde bewoording hou op om punte te kos.\", \"Unfamiliar wording stops costing marks.\") },\n          { text: T(\"Sy skryf die finale vraestel met 'n plan, nie met hoop nie.\", \"She writes the final paper with a plan, not with hope.\") }\n        ],\n        scarcityNote: T(\"Die groep bly op maks 10 leerders sodat elke kind se vrae gevra en beantwoord word voor die eindeksamen.\", \"The group stays at max 10 learners so every child's questions get asked and answered before the finals.\"),\n        faq: [\n          { q: T(\"Wanneer presies is die bootcamp?\", \"When exactly is the boot camp?\"), a: T(\"Die formaat en datums word binnekort bevestig:\", \"The format and dates are being confirmed:\"), tail: T(\"[FORMAAT] \\u00b7 [DATUMS] \\u00b7 [PLEK]\", \"[FORMAT] \\u00b7 [DATES] \\u00b7 [VENUE]\") },\n          { q: T(\"Wat kos dit?\", \"What does it cost?\"), a: T(\"Ons bespreek die prys op die gratis 15-min oproep, saam met of die bootcamp die regte ding vir jou kind is.\", \"We discuss the price on the free 15-min call, together with whether the boot camp is the right thing for your child.\") },\n          { q: T(\"My kind kry reeds 60 persent. Help dit nog?\", \"My child already gets 60 percent. Does this still help?\"), a: T(\"Ja. Die Hoekom-Eerste-metode is juis vir die leerder wat die werk ken maar punte verloor sodra die vraag anders lyk.\", \"Yes. The Why-First method is exactly for the learner who knows the work but loses marks the moment the question looks different.\") },\n          { q: T(\"Wie bied dit aan?\", \"Who runs it?\"), a: T(\"Mario, 'n gekwalifiseerde CA met 'n CGMA benoeming, wat Rekeningkunde op universiteitsvlak doseer.\", \"Mario, a qualified CA with a CGMA designation, who lectures Accounting at university level.\") }\n        ]\n      },\n\n      /* ------------------------- BOOTCAMP 3 ------------------------- */\n      {\n        id: \"gr10-lewenswetenskappe\",\n        grade: \"10\",\n        subject: T(\"Lewenswetenskappe \\u00b7 Engels-medium\", \"Life Sciences \\u00b7 English medium\"),\n        name: T(\"Graad 10 Lewenswetenskappe Bootcamp\", \"Grade 10 Life Sciences Boot Camp\"),\n        hook: T(\"Sy swot hard, die terme staan in die pad.\", \"She studies hard, the terms get in the way.\"),\n        eyebrow: T(\"Graad 10 \\u00b7 Lewenswetenskappe \\u00b7 Upington\", \"Grade 10 \\u00b7 Life Sciences \\u00b7 Upington\"),\n        headline: T(\"Sy swot ure lank. Die punt bly in die 40's.\", \"She studies for hours. The mark stays in the 40s.\"),\n        lead: T(\"By die huis praat julle Afrikaans. By die skool leer sy Lewenswetenskappe in Engels. Die inhoud is nie die probleem nie, die terme en die manier waarop vrae gevra word, is. Ons begin daar.\", \"At home you speak Afrikaans. At school she learns Life Sciences in English. The content is not the problem, the terms and the way questions are asked are. That is where we start.\"),\n        factRows: [\n          { label: T(\"Formaat\", \"Format\"), value: T(\"Persoonlik, aangesig tot aangesig\", \"In person, face to face\") },\n          { label: T(\"Groep\", \"Group\"), value: T(\"Maks 5 leerders\", \"Max 5 learners\") },\n          { label: T(\"Taal\", \"Language\"), value: T(\"Engels-medium\", \"English medium\") },\n          { label: T(\"Datums\", \"Dates\"), value: \"dates\" },\n          { label: T(\"Plek\", \"Venue\"), value: \"venue\" },\n          { label: T(\"Prys\", \"Price\"), value: T(\"Op die oproep\", \"On the call\") },\n          { label: T(\"Sluit\", \"Closes\"), value: \"closes\" }\n        ],\n        people: {\n          p1: T(\"Sy leer die hele aand voor die toets, en kry steeds 43 persent terug.\", \"She studies the whole night before the test, and still gets 43 percent back.\"),\n          p2: T(\"Om te betaal vir nog lesse wat dieselfde inhoud oor en oor verduidelik.\", \"Paying for more lessons that explain the same content over and over.\"),\n          p3: T(\"Sy besluit sy is nie slim genoeg vir wetenskap nie, en los verpleging, fisio of medies daar.\", \"She decides she is not smart enough for science, and gives up nursing, physio or medicine.\"),\n          p4: T(\"Sy lees 'n vraag, weet presies wat gevra word, en antwoord met die regte terme.\", \"She reads a question, knows exactly what is being asked, and answers with the right terms.\"),\n          quote: T(\"Sy ken die werk in Afrikaans. Sy kan dit net nie in die eksamen se woorde s\\u00ea nie.\", \"She knows the work in Afrikaans. She just can't say it in the exam's words.\")\n        },\n        process: {\n          believe: T(\"Lewenswetenskappe is net memoriseer.\", \"Life Sciences is just memorising.\"),\n          wrong: T(\"Dis verkeerd, want vir 'n kind wat in Engels leer is die probleem gewoonlik die terme en die bewoording van die vraag, nie die inhoud nie.\", \"That's wrong, because for English-medium learners the problem is usually the terms and the question wording, not the content.\"),\n          we: T(\"Ons leer eers die terme en die vraagwoorde, dan die inhoud.\", \"We teach the terms and the question words first, then the content.\"),\n          methodName: T(\"Die Terme-Eerste-metode\", \"The Terms-First method\"),\n          methodLine: T(\"Sodra sy die taal van die vraestel verstaan, wys die werk wat sy al die tyd geken het.\", \"Once she understands the language of the paper, the work she knew all along shows up.\"),\n          steps: [\n            { n: \"01\", title: T(\"Toets die terme\", \"Test the terms\"), body: T(\"Ons kyk watter woorde in die pad staan.\", \"We look at which words are getting in the way.\") },\n            { n: \"02\", title: T(\"Bou 'n termelys\", \"Build a term list\"), body: T(\"Elke term in albei tale, met 'n voorbeeld.\", \"Every term in both languages, with an example.\") },\n            { n: \"03\", title: T(\"Leer die vraagwoorde\", \"Learn the question words\"), body: T(\"Name, explain, discuss: wat elkeen regtig vra.\", \"Name, explain, discuss: what each one really asks for.\") },\n            { n: \"04\", title: T(\"Skryf in eksamen taal\", \"Write in exam language\"), body: T(\"Antwoorde wat merkers punte kan gee.\", \"Answers a marker can actually award marks to.\") }\n          ]\n        },\n        advantages: {\n          a1: { title: T(\"Maks 5 leerders\", \"Max 5 learners\"), body: T(\"Sy kan vra wat 'n woord beteken sonder om skaam te kry.\", \"She can ask what a word means without feeling embarrassed.\") },\n          a2: { title: T(\"Terme-Eerste-metode\", \"Terms-First method\"), body: T(\"Ons vat die taalmuur eerste weg, dan die inhoud.\", \"We take the language wall away first, then the content.\") },\n          a3: { title: T(\"Gebou vir Afrikaanse huise\", \"Built for Afrikaans homes\"), body: T(\"Sy leer in Engels, julle praat Afrikaans, ons werk in albei.\", \"She learns in English, you speak Afrikaans, we work in both.\") },\n          a4: { title: T(\"Rolien Britz as tutor\", \"Rolien Britz as tutor\"), body: T(\"37 jaar in die klaskamer, en voormalige NSS Hoofmerker.\", \"37 years in the classroom, and a former NSC Chief Marker.\") }\n        },\n        compare: {\n          colA: T(\"Nog 'n tutor wat die inhoud herhaal\", \"Another tutor repeating the content\"),\n          colB: T(\"Terme-Eerste Bootcamp\", \"Terms-First Boot Camp\"),\n          rows: [\n            { label: T(\"Waar die probleem gesoek word\", \"Where the problem gets looked for\"), a: T(\"By die inhoud\", \"In the content\"), b: T(\"By die terme en die bewoording\", \"In the terms and the wording\") },\n            { label: T(\"Taal\", \"Language\"), a: T(\"Net Engels\", \"English only\"), b: T(\"Engels, met Afrikaans langsaan waar nodig\", \"English, with Afrikaans alongside where needed\") },\n            { label: T(\"Groepgrootte\", \"Group size\"), a: T(\"'n Vol klas\", \"A full class\"), b: T(\"Maks 5 leerders\", \"Max 5 learners\") },\n            { label: T(\"Wie leer haar\", \"Who teaches her\"), a: T(\"Wissel\", \"Varies\"), b: T(\"Voormalige Vakadviseur en NSS Hoofmerker\", \"Former Subject Advisor and NSC Chief Marker\") }\n          ]\n        },\n        promise: [\n          { before: T(\"Leer die hele aand, kry 43 persent\", \"Studies all night, gets 43 percent\"), after: T(\"Leer slimmer, en die punt begin klim\", \"Studies smarter, and the mark starts climbing\") },\n          { before: T(\"'Ek is nie 'n wetenskap mens nie'\", \"'I'm not a science person'\"), after: T(\"'Ek weet wat die vraag vra'\", \"'I know what the question is asking'\") },\n          { before: T(\"Vermy verpleging en medies as opsie\", \"Rules out nursing and medicine as options\"), after: T(\"Hou die wetenskap deure oop vir Graad 11\", \"Keeps the science doors open for Grade 11\") }\n        ],\n        soWhat: T(\"Graad 10 is waar 'n kind besluit of sy 'n wetenskap mens is. Daardie besluit hou verpleging, fisio en medies oop, of maak dit toe.\", \"Grade 10 is where a child decides whether she is a science person. That decision keeps nursing, physio and medicine open, or closes them.\"),\n        tutor: {\n          initials: \"RB\",\n          photo: \"assets/tutor-rolien-v2.png\",\n          name: T(\"Rolien Britz\", \"Rolien Britz\"),\n          role: T(\"Lewenswetenskappe tutor\", \"Life Sciences tutor\"),\n          creds: [\n            { text: T(\"37 jaar onderwyservaring\", \"37 years teaching experience\") },\n            { text: T(\"Voormalige FET Lewenswetenskappe Vakadviseur\", \"Former FET Life Sciences Subject Advisor\") },\n            { text: T(\"Voormalige NSS Hoofmerker en Interne Moderator\", \"Former NSC Chief Marker and Internal Moderator\") }\n          ],\n          note: T(\"Sy het die vraestelle gemerk en gemodereer. Sy weet presies watter woorde punte gee en watter nie.\", \"She has marked and moderated the papers. She knows exactly which words earn marks and which do not.\")\n        },\n        testimonials: [\n          { text: T(\"Liam het aan die begin van die jaar Lewenswetenskappe gedruip, en sy ma het nie meer geweet wat om te doen nie. Hy het matriek geslaag met 'n vlak 5, en hy het die vak in Engels gehad.\", \"Liam was failing Life Sciences at the start of the year, and his mom did not know what to do any more. He passed matric with a level 5, and he took the subject in English.\"), who: T(\"Suckay, Liam se ma, matriek\", \"Suckay, Liam's mom, matric\") },\n          { text: T(\"Lia het nie Lewenswetenskappe in matriek gehad nie en moes dit vanjaar vat vir verpleging. Met net Rolien se notas en klasse slaag sy nou met 70 persent, sonder enige vorige kennis.\", \"Lia did not have Life Sciences in matric and had to take it this year for nursing. With just Rolien's notes and classes she is now passing with 70 percent, with no prior knowledge.\"), who: T(\"Lia, huidige leerder\", \"Lia, current learner\") }\n        ],\n        included: [\n          { name: T(\"Formaat\", \"Format\"), means: T(\"[FORMAAT WORD BEVESTIG]\", \"[FORMAT TO BE CONFIRMED]\"), ph: true },\n          { name: T(\"Insluitings\", \"Inclusions\"), means: T(\"[INSLUITINGS WORD BEVESTIG]\", \"[INCLUSIONS TO BE CONFIRMED]\"), ph: true },\n          { name: T(\"Prys\", \"Price\"), means: T(\"Ons bespreek dit op die gratis oproep.\", \"We discuss it on the free call.\") }\n        ],\n        guarantee: null,\n        ifNothing: [\n          { text: T(\"Nog 'n toets waar sy hard geleer het vir 43 persent.\", \"Another test where she studied hard for 43 percent.\") },\n          { text: T(\"Sy begin glo sy is nie slim genoeg vir wetenskap nie.\", \"She starts believing she is not smart enough for science.\") },\n          { text: T(\"Die keuse vir Graad 11 word vir haar gemaak.\", \"The Grade 11 choice gets made for her.\") }\n        ],\n        ifNow: [\n          { text: T(\"Die terme hou op om punte te steel.\", \"The terms stop stealing marks.\") },\n          { text: T(\"Sy sien dat sy die werk al die tyd geken het.\", \"She sees that she knew the work all along.\") },\n          { text: T(\"Die wetenskap deure bly oop vir Graad 11.\", \"The science doors stay open for Grade 11.\") }\n        ],\n        scarcityNote: T(\"Maks 5 leerders, en een plek is reeds gevat. Klein hou beteken sy kan vra wat 'n woord beteken sonder dat iemand kyk.\", \"Max 5 learners, and one spot is already taken. Keeping it small means she can ask what a word means without anyone watching.\"),\n        faq: [\n          { q: T(\"My kind is Afrikaans. Word die bootcamp in Engels aangebied?\", \"My child is Afrikaans. Is the boot camp presented in English?\"), a: T(\"Die bootcamp is Engels-medium, want dis die taal van haar vraestel. Waar 'n term vashaak, verduidelik ons dit in Afrikaans en gaan dan terug Engels toe.\", \"The boot camp is English medium, because that is the language of her paper. Where a term sticks, we explain it in Afrikaans and then go back to English.\") },\n          { q: T(\"Wanneer presies is dit?\", \"When exactly is it?\"), a: T(\"Dit is persoonlike klasse, aangesig tot aangesig, wat op 28 September begin. Registrasie sluit 26 September. Die plek deel ons op die oproep met ouers wat inskryf.\", \"These are in person classes, face to face, starting on 28 September. Registration closes 26 September. We share the venue on the call with parents who sign up.\") },\n          { q: T(\"Wat kos dit?\", \"What does it cost?\"), a: T(\"Ons bespreek die prys op die gratis 15-min oproep, saam met of die bootcamp die regte ding vir jou kind is.\", \"We discuss the price on the free 15-min call, together with whether the boot camp is the right thing for your child.\") },\n          { q: T(\"Hoeveel plekke is oor?\", \"How many spots are left?\"), a: T(\"Maks 5 leerders, en een plek is reeds gevat. Vier is oor.\", \"Max 5 learners, and one spot is already taken. Four are left.\") }\n        ]\n      }\n    ];\n\n    return { ui: ui, stats: stats, bootcamps: bootcamps };\n  }\n\n  buildDays(ui, lang) {\n    const out = [];\n    const d = new Date();\n    d.setHours(0, 0, 0, 0);\n    let guard = 0;\n    while (out.length < this.CONFIG.dayChipCount && guard < 40) {\n      d.setDate(d.getDate() + 1);\n      guard++;\n      if (d.getDay() === this.CONFIG.skipWeekday) continue;\n      out.push({\n        key: d.getFullYear() + \"-\" + (d.getMonth() + 1) + \"-\" + d.getDate(),\n        dow: ui.days[d.getDay()],\n        dm: d.getDate() + \" \" + ui.months[d.getMonth()],\n        full: ui.days[d.getDay()] + \" \" + d.getDate() + \" \" + ui.months[d.getMonth()]\n      });\n    }\n    return out;\n  }\n\n  renderVals() {\n    const lang = this.state.lang;\n    const raw = this.DATA();\n    const ui = this.loc(raw.ui, lang);\n    const stats = this.loc(raw.stats, lang);\n    const camps = this.loc(raw.bootcamps, lang);\n    const f = this.state.form;\n\n    const cfgOf = id => this.CONFIG.bootcamps[id] || { spotsTotal: 5, spotsTaken: 0, price: \"[R PRICE]\", dates: \"[DATES]\", venue: \"[VENUE]\", closes: \"[CLOSING DATE]\" };\n    const dots = n => new Array(Math.max(0, n)).fill(\"\\u25CF\").join(\"\");\n\n    const rows = camps.map((c, i) => {\n      const cfg = cfgOf(c.id);\n      const open = cfg.spotsTotal - cfg.spotsTaken;\n      return {\n        href: \"#/\" + c.id,\n        grade: c.grade,\n        subject: c.subject,\n        name: c.name,\n        hook: c.hook,\n        dotsOpen: dots(open),\n        dotsTaken: dots(cfg.spotsTaken),\n        spotsLine: open + \" \" + ui.spotsOpen,\n        delay: (80 + i * 70) + \"ms\"\n      };\n    });\n\n    const current = camps.filter(c => c.id === this.state.route)[0] || null;\n    let b = null;\n    if (current) {\n      const cfg = cfgOf(current.id);\n      const open = cfg.spotsTotal - cfg.spotsTaken;\n      const locv = v => (v && typeof v === \"object\" && v.__t) ? v[lang] : v;\n      const phMap = {\n        dates: locv(cfg.dates), venue: locv(cfg.venue), price: locv(cfg.price), closes: locv(cfg.closes),\n        format: lang === \"af\" ? \"[FORMAAT]\" : \"[FORMAT]\"\n      };\n      b = Object.assign({}, current, {\n        href: \"#/\" + current.id,\n        bookHref: \"#/\" + current.id + \"/book\",\n        facts: current.factRows.map(r => {\n          const mapped = typeof r.value === \"string\" && phMap[r.value] !== undefined;\n          const val = mapped ? phMap[r.value] : r.value;\n          const isPh = typeof val === \"string\" && val.indexOf(\"[\") === 0;\n          return { label: r.label, value: val, ph: isPh, plain: !isPh };\n        }),\n        compare: Object.assign({}, current.compare, {\n          rows: current.compare.rows.map(r => ({ label: r.label, a: r.a, b: r.b, colA: current.compare.colA, colB: current.compare.colB }))\n        }),\n        price: locv(cfg.price),\n        closes: locv(cfg.closes),\n        pricePh: String(locv(cfg.price)).indexOf(\"[\") === 0,\n        priceOk: String(locv(cfg.price)).indexOf(\"[\") !== 0,\n        closesPh: String(locv(cfg.closes)).indexOf(\"[\") === 0,\n        closesOk: String(locv(cfg.closes)).indexOf(\"[\") !== 0,\n        dotsOpen: dots(open),\n        dotsTaken: dots(cfg.spotsTaken),\n        spotsLine: open + \" \" + ui.spotsOpen,\n        filledLine: cfg.spotsTaken + \" \" + ui.filledOf + \" \" + cfg.spotsTotal + \" \" + ui.filledWord,\n        segments: new Array(cfg.spotsTotal).fill(0).map((x, i) => ({ filled: i < cfg.spotsTaken, empty: i >= cfg.spotsTaken })),\n        included: current.included.map(it => ({ name: it.name, means: it.means, ph: !!it.ph, plain: !it.ph })),\n        faq: current.faq.map(it => ({ q: it.q, a: it.a, tail: it.tail || \"\", hasTail: !!it.tail })),\n        tutor: Object.assign({}, current.tutor, {\n          creds: current.tutor.creds.map(c2 => ({ text: c2.text, ph: !!c2.ph, plain: !c2.ph }))\n        })\n      });\n    }\n\n    const days = this.buildDays(ui, lang).map(d => ({\n      dow: d.dow, dm: d.dm, full: d.full,\n      sel: f.date === d.full,\n      unsel: f.date !== d.full,\n      pick: () => this.upd(\"date\", d.full)\n    }));\n\n    const times = this.CONFIG.callTimes.map(t => ({\n      label: t,\n      sel: f.time === t,\n      unsel: f.time !== t,\n      pick: () => this.upd(\"time\", t)\n    }));\n\n    const v = this.validate();\n    const show = this.state.showErrors;\n    const slotSummary = (f.date || \"\") + (f.time ? \" \\u00b7 \" + f.time : \"\");\n\n    let waHref = \"https://wa.me/\" + this.CONFIG.whatsappNumber;\n    if (b) {\n      const lines = [\n        ui.waIntro, \"\",\n        ui.waBootcamp + \": \" + b.name,\n        ui.waParent + \": \" + f.name,\n        \"WhatsApp: \" + f.wa,\n        ui.waChild + \": \" + f.child,\n        ui.waSchool + \": \" + (f.school || \"-\"),\n        ui.waMark + \": \" + (f.mark ? f.mark + \"%\" : \"-\"),\n        ui.waWorry + \": \" + (f.worry || \"-\"),\n        ui.waSlot + \": \" + slotSummary\n      ];\n      waHref = \"https://wa.me/\" + this.CONFIG.whatsappNumber + \"?text=\" + encodeURIComponent(lines.join(\"\\n\"));\n    }\n\n    return {\n      ui: ui, stats: stats, rows: rows, b: b, f: f, days: days, times: times,\n      lang: lang,\n      afOn: lang === \"af\", afOff: lang !== \"af\",\n      enOn: lang === \"en\", enOff: lang !== \"en\",\n      setAf: () => this.setState({ lang: \"af\" }),\n      setEn: () => this.setState({ lang: \"en\" }),\n      isChooser: !current,\n      isDetail: !!current && this.state.view !== \"book\",\n      isBooking: !!current && this.state.view === \"book\",\n      hasGuarantee: !!(b && b.guarantee),\n      hasTutorPhoto: !!(b && b.tutor && b.tutor.photo),\n      hasTestimonials: !!(b && (b.testimonials || []).length),\n      mailSending: this.state.mailState === \"sending\",\n      mailSent: this.state.mailState === \"sent\",\n      mailFailed: this.state.mailState === \"failed\",\n      notifyEmail: this.CONFIG.notifyEmail,\n      mailtoHref: \"mailto:\" + this.CONFIG.notifyEmail + \"?subject=\" + encodeURIComponent(\"Bootcamp oproep: \" + (f.name || \"\")) + \"&body=\" + encodeURIComponent(this.bookingLines(b, ui, slotSummary).join(\"\\n\")),\n      testimonialSlots: b ? (b.testimonials || []).map(t => ({ text: t.text, who: t.who || \"\", ph: !!t.ph, plain: !t.ph, hint: ui.testimonialHint })) : [],\n      onName: e => this.upd(\"name\", e.target.value),\n      onWa: e => this.upd(\"wa\", e.target.value),\n      onChild: e => this.upd(\"child\", e.target.value),\n      onSchool: e => this.upd(\"school\", e.target.value),\n      onMark: e => this.upd(\"mark\", e.target.value),\n      onWorry: e => this.upd(\"worry\", e.target.value),\n      onConsent: e => this.upd(\"consent\", e.target.checked),\n      err: {\n        name: show && v.name, nameMsg: ui.errName,\n        wa: show && v.wa, waMsg: ui.errWa,\n        child: show && v.child, childMsg: ui.errChild,\n        date: show && v.date, dateMsg: ui.errDate,\n        time: show && v.time, timeMsg: ui.errTime,\n        consent: show && v.consent, consentMsg: ui.errConsent\n      },\n      submit: () => {\n        const bad = this.validate();\n        const any = Object.keys(bad).some(k => bad[k]);\n        if (any) { this.setState({ showErrors: true }); return; }\n        this.setState({ submitted: true, showErrors: false, mailState: \"sending\" });\n        this.sendBooking(b, ui, slotSummary);\n      },\n      editAgain: () => this.setState({ submitted: false, mailState: \"\" }),\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      successTitle: ui.successTitlePre + (f.name || \"\").trim() + \".\",\n      slotSummary: slotSummary,\n      waHref: waHref\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
